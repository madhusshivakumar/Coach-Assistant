[project]
name = "football-analysis"
version = "0.1.0"
description = "Top-down tactical analysis of 11v11 soccer: movement, formations, CV pipeline."
requires-python = ">=3.11,<3.12"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "madhu" }]
dependencies = [
    "kloppy>=3.15",
    "statsbombpy>=1.14",
    "numpy>=1.26",
    "pandas>=2.2",
    "polars>=1.5",
    "pyarrow>=15",
    "duckdb>=1.1",
    "pandera>=0.20",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "structlog>=24.1",
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "platformdirs>=4.2",
]

[project.optional-dependencies]
# socceraction is added in Phase 1 (VAEP/xT). It currently pins pandera<0.18,
# which conflicts with the Pandera 0.20+ API we use in data.validation — upgrade
# when socceraction releases a compatible version or we vendor VAEP ourselves.
analytics = [
    "scikit-learn>=1.4",
    "scipy>=1.12",
    "shapely>=2.0",
]
viz = [
    "mplsoccer>=1.4",
    "matplotlib>=3.8",
    "plotly>=5.22",
    "streamlit>=1.33",
    "soccerplots>=1.0",
    "imageio-ffmpeg>=0.5",
]
cv = [
    "opencv-python>=4.9",
    "torch>=2.2",
    "ultralytics>=8.1",
    "supervision>=0.19",
    "pillow>=10.2",
]

[project.scripts]
fa-data = "football_analysis.data.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.5",
    "pytest-randomly>=3.15",
    "pytest-mpl>=0.17",
    "hypothesis>=6.98",
    "syrupy>=4.6",
    "responses>=0.25",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "ipykernel>=6.29",
    "jupyterlab>=4.1",
    "nbstripout>=0.7",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/football_analysis"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "PL", "RUF", "PTH"]
ignore = ["PLR0913", "PLR0911", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S101", "PLC0415"]
"notebooks/**" = ["E402"]
"scripts/**" = ["PLC0415"]
"src/football_analysis/config.py" = ["PLW0603"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=football_analysis --cov-branch --cov-report=term-missing --cov-fail-under=90"
markers = [
    "slow: takes >1s",
    "integration: hits disk/network fixtures",
]

[tool.coverage.run]
source = ["src/football_analysis"]
branch = true
omit = ["src/football_analysis/app/**"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
